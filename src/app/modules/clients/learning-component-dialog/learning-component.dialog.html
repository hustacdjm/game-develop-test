<h2 mat-dialog-title>Game Learning Data</h2>
<mat-dialog-content class="mat-typography">
  
<ng-container *ngFor="let reactiveComponent of data.reactiveComponents">
<pre>

    {{reactiveComponent.component.content | json}}

</pre>
</ng-container>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="submit()" cdkFocusInitial>Submit</button>
</mat-dialog-actions>
